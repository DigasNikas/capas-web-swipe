# Runs scripts/train_classic_classifier.py and uploads report.json, the
# source of every table in dashboard/documentation/classic-classifiers.md.
# features=pixels needs nothing; the embedding feature sets read Vectorize
# (Vectorize · Read). No Workers AI.
name: Classic Experiments
run-name: "classic ${{ inputs.features }} ${{ inputs.split }} scale=${{ inputs.scale }} binary=${{ inputs.binary }} per_newspaper=${{ inputs.per_newspaper }}"

on:
  workflow_dispatch:
    inputs:
      features:
        description: "Feature set"
        type: choice
        options: [image, headline, both, pixels]
        default: image
      binary:
        description: "others vs a club, instead of four classes"
        type: boolean
        default: true
      scale:
        description: "Standardise features before fitting"
        type: boolean
        default: false
      per_newspaper:
        description: "Train and test each newspaper on its own covers"
        type: boolean
        default: false
      split:
        description: "Split"
        type: choice
        options: [chronological, stratified]
        default: chronological

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -c scripts/requirements.txt numpy pillow scikit-learn
      - name: Run the experiment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/train_classic_classifier.py \
            --features "${{ inputs.features }}" \
            --split "${{ inputs.split }}" \
            ${{ inputs.binary && '--binary' || '' }} \
            ${{ inputs.scale && '--scale' || '' }} \
            ${{ inputs.per_newspaper && '--per-newspaper' || '' }} \
            --report-json report.json
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.json
