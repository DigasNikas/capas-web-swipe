name: _tmp clear ai fields for July+August covers

# Temporary, one-off: re-wipe ai_club/ai_headline/ai_why/ai_rag_covers for
# every July+August 2026 cover ahead of a fresh Classify Covers pass under
# the current (crest-aware, photo-first) prompt. Deleted right after use.

on:
  workflow_dispatch:

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g wrangler
      - name: Count affected rows first
        run: |
          wrangler d1 execute capas-db --remote --command "
            SELECT COUNT(*) AS jul_aug_covers,
                   SUM(CASE WHEN ai_club IS NOT NULL THEN 1 ELSE 0 END) AS currently_classified
            FROM covers
            WHERE date LIKE '2026-07%' OR date LIKE '2026-08%'
          "
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Clear ai_club/ai_headline/ai_why/ai_rag_covers for July+August covers
        run: |
          wrangler d1 execute capas-db --remote --command "
            UPDATE covers
            SET ai_club = NULL, ai_headline = NULL, ai_why = NULL, ai_rag_covers = NULL
            WHERE date LIKE '2026-07%' OR date LIKE '2026-08%'
          "
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
