name: Build Vectorize Index

# Weekly full re-embed, kept as the safety net now that a cover's first vote
# also fires a single-cover embed of its own (vectorize-one-cover.yml, via
# repository_dispatch from api/handlers/swipes.js) — this run still re-embeds
# every crowd-labelled cover (~1,700+ and growing), which is what catches a
# missed dispatch or a later vote flip that changes a cover's label after
# its first upsert. See rag.md and image-embeddings.md for more.

on:
  schedule:
    - cron: "0 10 * * 0"   # Sunday 10:00 UTC — clear of the daily scrape window
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow torch transformers
      - name: Embed every crowd-labelled cover and upsert to Vectorize
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/build_vectorize_index.py
