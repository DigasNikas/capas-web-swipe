<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avaliador de Capas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <h1>Avaliador de Capas</h1>
      <div class="header-actions">
        <button id="btn-view-catalogue" class="btn-secondary">
          Catalogue <span id="catalogue-count" class="badge">0</span>
        </button>
        <button id="btn-export" class="btn-secondary">Export JSON</button>
      </div>
    </header>

    <!-- Legend -->
    <div class="legend">
      <span class="legend-item left">← A Bola</span>
      <span class="legend-item up">↑ O Jogo</span>
      <span class="legend-item down">↓ Skip</span>
      <span class="legend-item right">→ Record</span>
    </div>

    <!-- Card Stack -->
    <main id="card-area">
      <div id="card-stack"></div>

      <!-- All done -->
      <div id="empty-state" class="hidden">
        <div class="empty-icon">✓</div>
        <p>All images catalogued!</p>
        <button id="btn-reset" class="btn-primary">Start Over</button>
      </div>

      <!-- Loading -->
      <div id="loading-state" class="hidden">
        <div class="empty-icon">⏳</div>
        <p>Loading images…</p>
      </div>
    </main>

    <!-- Action Buttons -->
    <div id="action-buttons">
      <button class="action-btn abola"  data-action="abola"  title="A Bola (←)">🔴</button>
      <button class="action-btn ojogo"  data-action="ojogo"  title="O Jogo (↑)">🟡</button>
      <button class="action-btn skip"   data-action="skip"   title="Skip (↓)">✕</button>
      <button class="action-btn record" data-action="record" title="Record (→)">🟢</button>
    </div>

    <!-- Catalogue Modal -->
    <div id="catalogue-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Catalogue</h2>
          <button id="btn-close-modal" class="btn-icon">✕</button>
        </div>
        <div class="modal-filters">
          <button class="filter-btn active" data-filter="all">Todos</button>
          <button class="filter-btn" data-filter="abola">A Bola</button>
          <button class="filter-btn" data-filter="ojogo">O Jogo</button>
          <button class="filter-btn" data-filter="record">Record</button>
          <button class="filter-btn" data-filter="skip">Skip</button>
        </div>
        <div id="catalogue-grid"></div>
        <p id="catalogue-empty" class="catalogue-empty hidden">Nenhuma imagem nesta categoria.</p>
      </div>
    </div>
    <div id="modal-overlay" class="hidden"></div>

    <!-- Progress bar -->
    <div id="progress-bar-container" class="hidden">
      <div id="progress-bar"></div>
      <span id="progress-text"></span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
