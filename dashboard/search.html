<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Avaliador de capas · search</title>
<!-- Text search over covers.headlines (D1 FTS5, see /api/search and
     dashboard/documentation/search.md). Public, no auth, same reasoning as
     /documentation and similarities.html: nothing here is a secret, just
     scraped headline text with no user attached to it. Not linked from
     anywhere in the public UI yet. -->
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230a0a0f'/><path d='M16 9l5 3.6-2 6.4h-6l-2-6.4Z' fill='%23ffd60a'/></svg>">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #13131a;
    --panel2: #1c1c26;
    --text: #ffffff;
    --muted: #7a7a8c;
    --yellow: #ffd60a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter Tight', sans-serif;
    line-height: 1.5;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--panel2);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 3;
  }
  header h1 { margin: 0; font-size: 1.1rem; font-weight: 800; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 .dot { color: var(--yellow); }
  header .sub {
    color: var(--muted);
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  main { max-width: 900px; margin: 0 auto; padding: 28px 22px 80px; }

  #coverage { color: var(--muted); font-size: 0.8rem; margin: 0 0 18px; font-family: 'JetBrains Mono', monospace; }

  #q {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel2);
    color: var(--text);
    font-family: 'Inter Tight', sans-serif;
    font-size: 1rem;
    padding: 12px 14px;
  }
  #q:focus { outline: 1px solid var(--yellow); }

  #status { color: var(--muted); font-size: 0.8rem; margin-top: 10px; font-family: 'JetBrains Mono', monospace; }
  #status.error { color: #f87171; }

  #results {
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
  }
  .result {
    display: block;
    background: var(--panel2);
    border: 1px solid var(--panel2);
  }
  .result:hover, .result:focus-visible { outline: 1px solid var(--yellow); }
  .result img {
    width: 100%;
    aspect-ratio: 0.78;
    object-fit: cover;
    background: var(--panel2);
    display: block;
  }
  .empty { color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1><a href="/">avaliador<span class="dot">.</span>capas</a></h1>
  <span class="sub">search</span>
</header>
<main>
  <div id="coverage"></div>
  <input id="q" type="search" placeholder="ex.: Palhinha, derby, Champions…" autocomplete="off" />
  <div id="status"></div>
  <div id="results"></div>
</main>

<script>
const PAPER_NAMES = { abola: 'A Bola', ojogo: 'O Jogo', record: 'Record' };

const coverageEl = document.getElementById('coverage');
const statusEl   = document.getElementById('status');
const resultsEl  = document.getElementById('results');
const qEl        = document.getElementById('q');

let debounceTimer = null;
qEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => search(qEl.value), 300);
});

search('');

async function search(q) {
  statusEl.textContent = 'A procurar…';
  statusEl.classList.remove('error');

  let res;
  try {
    res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
  } catch (err) {
    statusEl.textContent = `Erro de rede: ${err}`;
    statusEl.classList.add('error');
    return;
  }

  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).error ?? ''; } catch { /* not JSON, no extra detail */ }
    statusEl.textContent = `Erro ${res.status}${detail ? `: ${detail}` : '.'}`;
    statusEl.classList.add('error');
    return;
  }

  const { results, total, searchable } = await res.json();
  coverageEl.textContent = `A procura cobre ${searchable} de ${total} capas — só as que já têm texto real da capa (ver Headlines na documentação).`;
  statusEl.textContent = q.trim() ? `${results.length} resultado${results.length === 1 ? '' : 's'}.` : '';
  render(results);
}

function render(results) {
  resultsEl.innerHTML = '';
  if (qEl.value.trim() && results.length === 0) {
    resultsEl.innerHTML = '<div class="empty">Nenhum resultado.</div>';
    return;
  }

  results.forEach(r => {
    const a = document.createElement('a');
    a.className = 'result';
    a.href = r.url;
    a.target = '_blank';
    a.rel = 'noopener';

    const d = new Date(r.date + 'T00:00:00');
    const label = `${PAPER_NAMES[r.newspaper] || r.newspaper} · ${d.toLocaleDateString('pt-PT')}`;
    a.title = `${label}\n${r.headlines}`;

    const img = document.createElement('img');
    img.src = r.thumb_url || r.url;
    img.alt = label;
    img.loading = 'lazy';
    a.appendChild(img);

    resultsEl.appendChild(a);
  });
}
</script>
</body>
</html>
