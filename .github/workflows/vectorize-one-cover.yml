name: Vectorize One Cover

# Fired by the Worker's handleSwipe the moment a cover gets its first crowd
# vote (repository_dispatch event type cover-first-vote, client_payload
# cover_id) — see api/lib/github.js and api/handlers/swipes.js. A cover has
# no crowd label before that, so this is the earliest point it can be
# embedded at all, and — now that the old weekly full-rebuild workflow is
# gone — the only automatic path into the index. A missed dispatch or a
# later vote flip that changes a cover's label after its first upsert
# needs a manual `workflow_dispatch` (this one, --cover-id) or a local
# `build_vectorize_index.py` run to catch up; nothing else does.

on:
  repository_dispatch:
    types: [cover-first-vote]
  workflow_dispatch:
    inputs:
      cover_id:
        description: "cover_id to embed"
        required: true

jobs:
  vectorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow torch transformers
      - name: Embed and upsert one cover
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/build_vectorize_index.py \
            --cover-id "${{ github.event.client_payload.cover_id || inputs.cover_id }}"
