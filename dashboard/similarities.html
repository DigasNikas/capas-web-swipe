<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Avaliador de capas · similarities</title>
<!-- Internal tool: every cover with ai_rag_covers recorded, next to the
     covers RAG actually matched it against, for eyeballing whether the
     CLIP image embeddings retrieve genuinely similar covers or just
     same-newspaper layout (see dashboard/documentation/rag.md and
     image-embeddings.md for the background). Linked from the footer of
     every dashboard page, like /documentation — public, no auth, same
     reasoning: nothing here is a secret, just AI guesses and retrieval
     matches with no user attached to them. It stays noindex, though: it
     is a diagnostic view, not something to land on from a search engine. -->
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230a0a0f'/><path d='M16 9l5 3.6-2 6.4h-6l-2-6.4Z' fill='%23ffd60a'/></svg>">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #13131a;
    --panel2: #1c1c26;
    --text: #ffffff;
    --muted: #7a7a8c;
    --yellow: #ffd60a;
    --sporting: #16a34a;
    --porto: #1d4ed8;
    --benfica: #dc2626;
    --others: #52525b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter Tight', sans-serif;
    line-height: 1.5;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--panel2);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 3;
  }
  header h1 { margin: 0; font-size: 1.1rem; font-weight: 800; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 .dot { color: var(--yellow); }
  header .sub {
    color: var(--muted);
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 22px 80px; }

  #status { color: var(--muted); font-size: 0.8rem; margin-top: 10px; font-family: 'JetBrains Mono', monospace; }

  .channels { display: flex; gap: 6px; margin: 16px 0 4px; flex-wrap: wrap; }
  .channels button {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--panel2);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .channels button:hover { color: var(--text); }
  .channels button.on { color: var(--bg); background: var(--yellow); border-color: var(--yellow); }

  .site-footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 22px 40px;
    border-top: 1px solid var(--panel2);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
  }
  .site-footer-nav { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; }
  .site-footer-nav a { color: var(--text); text-decoration: none; letter-spacing: 0.04em; }
  .site-footer-nav a:hover { color: var(--yellow); }
  .footer-dot { color: var(--muted); }
  .site-footer-copy { font-size: 0.68rem; opacity: 0.7; }
  #status.error { color: #f87171; }

  #groups { margin-top: 26px; display: flex; flex-direction: column; gap: 26px; }
  .group {
    display: flex;
    gap: 20px;
    background: var(--panel);
    border: 1px solid var(--panel2);
    padding: 16px;
  }
  .main-cover { flex: 0 0 140px; }
  .main-cover img, .ref-cover img {
    width: 100%;
    aspect-ratio: 0.78;
    object-fit: cover;
    background: var(--panel2);
    display: block;
  }
  .cover-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 6px;
  }
  .club-tag {
    display: inline-block;
    font-weight: 800;
    font-size: 0.65rem;
    padding: 2px 6px;
    color: #fff;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .headline {
    font-size: 0.75rem;
    font-style: italic;
    color: var(--text);
    margin-top: 6px;
  }
  .refs {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 10px;
    align-content: start;
  }
  .ref-cover .club-tag { font-size: 0.6rem; }
  .empty { color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1><a href="/">avaliador<span class="dot">.</span>capas</a></h1>
  <span class="sub">similarities</span>
</header>
<main>
  <div class="channels" role="group" aria-label="Canal de retrieval">
    <button type="button" data-via="headline" class="on">Por texto</button>
    <button type="button" data-via="layout">Por imagem</button>
  </div>
  <div id="status"></div>
  <div id="groups"></div>
</main>

<footer class="site-footer">
  <nav class="site-footer-nav">
    <a href="/">Dashboard</a>
    <span class="footer-dot">·</span>
    <a href="/documentation">Documentação</a>
    <span class="footer-dot">·</span>
    <a href="/search.html">Pesquisa</a>
    <span class="footer-dot">·</span>
    <a href="https://github.com/DigasNikas" target="_blank" rel="noopener">GitHub</a>
    <span class="footer-dot">·</span>
    <span class="site-footer-copy">© 2026 Diogo Nicolau</span>
  </nav>
</footer>

<script type="module" src="/similarities.js?v=2"></script>
</body>
</html>
