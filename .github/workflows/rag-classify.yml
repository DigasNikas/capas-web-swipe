name: RAG Reclassify

# Triggered automatically by repository_dispatch (event type
# scrape-completed), fired from the Worker's scheduled() handler right
# after each day's scrape finishes — see api/lib/github.js and
# api/index.js. /rag-candidates only ever returns covers still missing
# ai_club, so this stays a small, bounded, self-converging batch (default
# limit 10 — a normal day adds 3 covers, one per newspaper) rather than the
# unbounded backfill that once starved the routine scrape-time
# classification of its Workers AI neuron quota for a week (the
# zero-shot-only backfill-ai endpoint that caused that has since been
# removed). Also runnable by hand via workflow_dispatch.

on:
  repository_dispatch:
    types: [scrape-completed]
  workflow_dispatch:
    inputs:
      limit:
        description: "How many recent covers to reclassify"
        required: false
        default: "10"

jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow torch transformers
      - name: Reclassify recent covers with RAG few-shot context
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # inputs.limit is only set on workflow_dispatch — repository_dispatch
        # (the daily scrape-completed trigger) has no `inputs` context, so
        # this falls back to the same default: 10.
        run: python3 scripts/rag_classify.py --limit "${{ inputs.limit || '10' }}"
