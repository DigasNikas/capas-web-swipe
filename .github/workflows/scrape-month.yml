name: Scrape Newspaper Covers (Full Month)

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year (YYYY)"
        required: true
      month:
        description: "Month (1-12)"
        required: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # scripts/scrape_month.sh chunks the month into 7-day windows (the
      # /api/scrape subrequest limit) and calls each one itself.
      - uses: actions/checkout@v4
      - name: Run scrape_month.sh
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: ./scripts/scrape_month.sh "${{ inputs.year }}" "${{ inputs.month }}"
