name: Scrape Newspaper Covers

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to scrape"
        type: choice
        options: [days, range, month]
        default: days
      days:
        description: "mode=days: number of recent days (max 7)"
        required: false
        default: "2"
      start:
        description: "mode=range: start date (YYYYMMDD, max 7-day span)"
        required: false
      end:
        description: "mode=range: end date (YYYYMMDD, max 7-day span)"
        required: false
      year:
        description: "mode=month: year (YYYY)"
        required: false
      month:
        description: "mode=month: month (1-12)"
        required: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # workers.dev, not capas.digasnikas.com: Bot Fight Mode challenges
      # GitHub's runners on the zone and has no per-path exemption on this
      # plan, so every run answered 403 from August on. This hostname is off
      # the zone; the Worker's own ADMIN_SECRET check is unchanged. -f is gone
      # on purpose: it hides the response body, which is how you tell a
      # Cloudflare challenge page from the Worker rejecting the token.
      - name: Scrape by days
        if: inputs.mode == 'days'
        run: |
          code=$(curl -sS -X POST -o response.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            "https://capas-scraper.digasnikas-digital.workers.dev/scrape?days=${{ inputs.days }}")
          echo "HTTP $code"
          head -c 2000 response.txt
          test "$code" = "202"

      - name: Scrape by date range
        if: inputs.mode == 'range'
        run: |
          code=$(curl -sS -X POST -o response.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            "https://capas-scraper.digasnikas-digital.workers.dev/scrape?start=${{ inputs.start }}&end=${{ inputs.end }}")
          echo "HTTP $code"
          head -c 2000 response.txt
          test "$code" = "202"

      # scripts/scrape_month.sh chunks the month into 7-day windows (the
      # /api/scrape subrequest limit) and calls each one itself.
      - name: Scrape full month
        if: inputs.mode == 'month'
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: ./scripts/scrape_month.sh "${{ inputs.year }}" "${{ inputs.month }}"
