name            = "capas-scraper"
main            = "api/index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 5-8 * * *"]   # 05:00–08:00 UTC daily, hourly (06:00–09:00 Lisbon winter / 07:00–10:00 Lisbon summer)

[[routes]]
pattern   = "capas.digasnikas.com/api/*"
zone_name = "digasnikas.com"

[[routes]]
pattern   = "app.capas.digasnikas.com/api/*"
zone_name = "digasnikas.com"

# Access app on app.capas.digasnikas.com. api/lib/access.js checks its JWTs
# against these. The AUD tag is in Zero Trust > Access > Applications.
[vars]
ACCESS_TEAM_DOMAIN = "digasnikas-digital.cloudflareaccess.com"
ACCESS_AUD         = "fcf7c786d5c3e993e0f0c5a72c0e04d01226390233c71f32059efb697e23f407"

[[r2_buckets]]
binding     = "COVERS_BUCKET"
bucket_name = "capas-storage"

[[d1_databases]]
binding       = "DB"
database_name = "capas-db"
database_id   = "a21b563d-6d8d-4355-af98-92045becf861"
migrations_dir = "migrations"

[images]
binding = "IMAGES"

[ai]
binding = "AI"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
