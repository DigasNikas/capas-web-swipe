<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Avaliador de capas · search</title>
<!-- Text search over covers.headlines (D1 FTS5, see /api/search and
     dashboard/documentation/search.md). Public, no auth, same reasoning as
     /documentation and similarities.html: nothing here is a secret, just
     scraped headline text with no user attached to it. Not linked from
     anywhere in the public UI yet. -->
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230a0a0f'/><path d='M16 9l5 3.6-2 6.4h-6l-2-6.4Z' fill='%23ffd60a'/></svg>">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #13131a;
    --panel2: #1c1c26;
    --text: #ffffff;
    --muted: #7a7a8c;
    --yellow: #ffd60a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter Tight', sans-serif;
    line-height: 1.5;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--panel2);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 3;
  }
  header h1 { margin: 0; font-size: 1.1rem; font-weight: 800; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 .dot { color: var(--yellow); }
  header .sub {
    color: var(--muted);
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  main { max-width: 900px; margin: 0 auto; padding: 28px 22px 80px; }

  #coverage { color: var(--muted); font-size: 0.8rem; margin: 0 0 18px; font-family: 'JetBrains Mono', monospace; }

  #q {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel2);
    color: var(--text);
    font-family: 'Inter Tight', sans-serif;
    font-size: 1rem;
    padding: 12px 14px;
  }
  #q:focus { outline: 1px solid var(--yellow); }

  #status { color: var(--muted); font-size: 0.8rem; margin-top: 10px; font-family: 'JetBrains Mono', monospace; }
  #status.error { color: #f87171; }

  #results {
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
  }
  .result {
    display: block;
    background: var(--panel2);
    border: 1px solid var(--panel2);
    cursor: pointer;
    padding: 0;
  }
  .result:hover, .result:focus-visible { outline: 1px solid var(--yellow); }
  .result img {
    width: 100%;
    aspect-ratio: 0.78;
    object-fit: cover;
    background: var(--panel2);
    display: block;
  }
  .empty { color: var(--muted); margin-top: 20px; }

  .hidden { display: none !important; }

  /* Cover modal, same visual language as the main dashboard's
     d-cover-modal — this page has no shared stylesheet, so it's
     reimplemented here rather than imported. #modal2 stacks visually on
     top of #modal1 (higher z-index) rather than replacing it, since
     opening a similar cover should feel like drilling in, not navigating
     away. */
  .cmodal {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    cursor: zoom-out;
  }
  /* modal2 doesn't cover the screen like modal1 does — the original cover
     stays exactly where it is, dimmed but visible, and this floats a
     smaller panel on top of it rather than replacing it. */
  #modal2 { z-index: 210; background: rgba(0, 0, 0, 0.4); }
  .cmodal img {
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    cursor: default;
  }
  #modal1 img { max-height: 60vh; }
  .cmodal-panel {
    position: relative;
    max-width: 55vw;
    max-height: 55vh;
    cursor: default;
  }
  .cmodal-panel img { max-width: 100%; max-height: 100%; display: block; }
  .cmodal-close {
    position: absolute;
    top: 16px;
    right: 20px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
  }
  .cmodal-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
  }
  .cmodal-nav:hover { background: rgba(255, 255, 255, 0.18); }
  .cmodal-nav:disabled { opacity: 0.25; cursor: default; }
  .cmodal-prev { left: 16px; }
  .cmodal-next { right: 16px; }

  #similar-strip {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    cursor: default;
  }
  #similar-strip .sim-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    align-self: center;
    margin-right: 4px;
  }
  #similar-strip img {
    width: 56px;
    aspect-ratio: 0.78;
    object-fit: cover;
    box-shadow: none;
    cursor: pointer;
  }
  #similar-strip img:hover { outline: 2px solid var(--yellow); }
</style>
</head>
<body>
<header>
  <h1><a href="/">avaliador<span class="dot">.</span>capas</a></h1>
  <span class="sub">search</span>
</header>
<main>
  <div id="coverage"></div>
  <input id="q" type="search" placeholder="ex.: Palhinha, derby, Champions…" autocomplete="off" />
  <div id="status"></div>
  <div id="results"></div>
</main>

<div id="modal1" class="cmodal hidden">
  <button class="cmodal-close" id="modal1-close" aria-label="Fechar">&times;</button>
  <img id="modal1-img" src="" alt="" />
  <div id="similar-strip" class="hidden"></div>
</div>

<div id="modal2" class="cmodal hidden">
  <div class="cmodal-panel">
    <button class="cmodal-close" id="modal2-close" aria-label="Fechar">&times;</button>
    <button class="cmodal-nav cmodal-prev" id="modal2-prev" type="button" aria-label="Capa anterior">‹</button>
    <img id="modal2-img" src="" alt="" />
    <button class="cmodal-nav cmodal-next" id="modal2-next" type="button" aria-label="Capa seguinte">›</button>
  </div>
</div>

<script>
const PAPER_NAMES = { abola: 'A Bola', ojogo: 'O Jogo', record: 'Record' };

const coverageEl = document.getElementById('coverage');
const statusEl   = document.getElementById('status');
const resultsEl  = document.getElementById('results');
const qEl        = document.getElementById('q');

let debounceTimer = null;
qEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => search(qEl.value), 300);
});

search('');

// The 5 RAG few-shot matches per cover, resolved by /api/similarities —
// only covers the AI Detector has actually classified with RAG context
// have any, everything else's modal just skips the strip. Fetched once,
// not re-fetched per modal open.
let similaritiesById = new Map();
fetch('/api/similarities')
  .then(res => (res.ok ? res.json() : []))
  .then(list => list.forEach(entry => similaritiesById.set(entry.id, entry)))
  .catch(() => { /* similar-covers strip just stays empty */ });

async function search(q) {
  statusEl.textContent = 'A procurar…';
  statusEl.classList.remove('error');

  let res;
  try {
    res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
  } catch (err) {
    statusEl.textContent = `Erro de rede: ${err}`;
    statusEl.classList.add('error');
    return;
  }

  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).error ?? ''; } catch { /* not JSON, no extra detail */ }
    statusEl.textContent = `Erro ${res.status}${detail ? `: ${detail}` : '.'}`;
    statusEl.classList.add('error');
    return;
  }

  const { results, total, searchable } = await res.json();
  coverageEl.textContent = `A procura cobre ${searchable} de ${total} capas — só as que já têm texto real da capa (ver Headlines na documentação).`;
  statusEl.textContent = q.trim() ? `${results.length} resultado${results.length === 1 ? '' : 's'}.` : '';
  render(results);
}

function render(results) {
  resultsEl.innerHTML = '';
  if (qEl.value.trim() && results.length === 0) {
    resultsEl.innerHTML = '<div class="empty">Nenhum resultado.</div>';
    return;
  }

  results.forEach(r => {
    const div = document.createElement('div');
    div.className = 'result';
    div.tabIndex = 0;
    div.setAttribute('role', 'button');

    const d = new Date(r.date + 'T00:00:00');
    const label = `${PAPER_NAMES[r.newspaper] || r.newspaper} · ${d.toLocaleDateString('pt-PT')}`;
    div.title = `${label}\n${r.headlines}`;

    const img = document.createElement('img');
    img.src = r.thumb_url || r.url;
    img.alt = label;
    img.loading = 'lazy';
    div.appendChild(img);

    const open = () => openModal1(r);
    div.addEventListener('click', open);
    div.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });

    resultsEl.appendChild(div);
  });
}

const modal1 = document.getElementById('modal1');
const modal1Img = document.getElementById('modal1-img');
const similarStrip = document.getElementById('similar-strip');

function openModal1(r) {
  modal1Img.src = r.url;
  modal1Img.alt = PAPER_NAMES[r.newspaper] || r.newspaper;

  const ragCovers = similaritiesById.get(r.id)?.ragCovers ?? [];
  similarStrip.innerHTML = '';
  similarStrip.classList.toggle('hidden', ragCovers.length === 0);
  if (ragCovers.length) {
    const label = document.createElement('span');
    label.className = 'sim-label';
    label.textContent = 'Parecidas:';
    similarStrip.appendChild(label);

    ragCovers.forEach((rc, i) => {
      const img = document.createElement('img');
      img.src = rc.thumb_url || rc.url;
      img.alt = PAPER_NAMES[rc.newspaper] || rc.newspaper;
      img.loading = 'lazy';
      img.addEventListener('click', () => openModal2(ragCovers, i));
      similarStrip.appendChild(img);
    });
  }

  modal1.classList.remove('hidden');
}

function closeModal1() {
  closeModal2();
  modal1.classList.add('hidden');
  modal1Img.src = '';
  similarStrip.innerHTML = '';
  similarStrip.classList.add('hidden');
}

document.getElementById('modal1-close').addEventListener('click', closeModal1);
modal1.addEventListener('click', closeModal1);
modal1Img.addEventListener('click', e => e.stopPropagation());
similarStrip.addEventListener('click', e => e.stopPropagation());

// The carousel over one cover's RAG matches — opened from similar-strip,
// stacked visually above modal1 rather than replacing it. Same
// prev/next-paging shape as the main dashboard's "onde discordam"
// lightbox (dashboard.js's stepDiffModal).
const modal2 = document.getElementById('modal2');
const modal2Img = document.getElementById('modal2-img');
const modal2Prev = document.getElementById('modal2-prev');
const modal2Next = document.getElementById('modal2-next');
let carouselItems = null;
let carouselIndex = 0;

function openModal2(items, index) {
  carouselItems = items;
  carouselIndex = index;
  renderModal2();
  modal2.classList.remove('hidden');
}

function stepModal2(delta) {
  const next = carouselIndex + delta;
  if (!carouselItems || next < 0 || next >= carouselItems.length) return;
  carouselIndex = next;
  renderModal2();
}

function renderModal2() {
  const c = carouselItems[carouselIndex];
  modal2Img.src = c.url;
  modal2Img.alt = PAPER_NAMES[c.newspaper] || c.newspaper;
  modal2Prev.disabled = carouselIndex === 0;
  modal2Next.disabled = carouselIndex === carouselItems.length - 1;
}

function closeModal2() {
  modal2.classList.add('hidden');
  modal2Img.src = '';
  carouselItems = null;
}

document.getElementById('modal2-close').addEventListener('click', closeModal2);
modal2.addEventListener('click', closeModal2);
document.querySelector('#modal2 .cmodal-panel').addEventListener('click', e => e.stopPropagation());
modal2Prev.addEventListener('click', e => { e.stopPropagation(); stepModal2(-1); });
modal2Next.addEventListener('click', e => { e.stopPropagation(); stepModal2(1); });

// Left/right paging through the 5 "parecidas" from the keyboard, not just
// the ‹ › buttons — only while the carousel is actually open.
document.addEventListener('keydown', e => {
  if (modal2.classList.contains('hidden')) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepModal2(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepModal2(1); }
});
</script>
</body>
</html>
