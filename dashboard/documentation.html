<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Avaliador de capas — documentation</title>
<!-- Internal documentation for whoever works on the codebase; the READMEs
     point here for anything beyond where the files are. Public only because
     there is nothing to gate it behind, hence the noindex below. -->
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230a0a0f'/><path d='M16 9l5 3.6-2 6.4h-6l-2-6.4Z' fill='%23ffd60a'/></svg>">
<style>
  /* Same palette as dashboard.css — this page has no separate design system,
     it's the site's own dark theme with a reading layout on top. Landing
     itself has no light/dark toggle, so neither does this. */
  :root {
    --bg: #0a0a0f;
    --panel: #13131a;
    --panel2: #1c1c26;
    --text: #ffffff;
    --muted: #7a7a8c;
    --yellow: #ffd60a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter Tight', sans-serif;
    line-height: 1.55;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--panel2);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 3;
  }
  header h1 { margin: 0; font-size: 1.1rem; font-weight: 800; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 .dot { color: var(--yellow); }
  header .sub {
    color: var(--muted);
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .layout { display: flex; min-height: calc(100vh - 49px); }

  #nav {
    width: 260px;
    flex-shrink: 0;
    border-right: 1px solid var(--panel2);
    background: var(--panel);
    padding: 18px 0 40px;
    position: sticky;
    top: 49px;
    height: calc(100vh - 49px);
    overflow-y: auto;
  }
  #nav a {
    display: block;
    padding: 6px 22px;
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
    font-family: 'JetBrains Mono', monospace;
  }
  #nav a:hover { background: var(--panel2); }
  #nav a.active { color: var(--yellow); font-weight: 700; background: var(--panel2); }
  #nav a.section { padding-left: 38px; font-size: 0.75rem; color: var(--muted); }
  #nav a.section:hover { color: var(--text); }
  #nav .nav-group {
    margin-top: 10px;
    padding: 8px 22px 2px;
    font-size: 0.68rem;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  main { flex: 1; min-width: 0; padding: 28px 40px 80px; max-width: 860px; }

  main h1 { font-size: 1.7rem; margin: 0 0 18px; font-weight: 800; }
  main h2 {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 34px 0 12px;
    padding-top: 14px;
    border-top: 1px solid var(--panel2);
  }
  main h3 { font-size: 1.02rem; font-weight: 700; margin: 24px 0 10px; }
  main p { margin: 0 0 12px; color: var(--text); }
  main ul, main ol { margin: 0 0 12px; padding-left: 26px; }
  main li { margin: 4px 0; }
  main code {
    background: var(--panel2);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.88em;
    font-family: 'JetBrains Mono', monospace;
  }
  main pre {
    background: var(--panel2);
    border: 1px solid var(--panel2);
    border-radius: 4px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 0 0 14px;
  }
  main pre code { background: none; padding: 0; font-size: 0.8rem; }
  main table {
    border-collapse: collapse;
    margin: 0 0 14px;
    display: block;
    overflow-x: auto;
    max-width: 100%;
    font-size: 0.85rem;
  }
  main th, main td {
    border: 1px solid var(--panel2);
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  main th { background: var(--panel2); }
  main blockquote {
    margin: 0 0 12px;
    padding: 4px 14px;
    border-left: 3px solid var(--yellow);
    color: var(--muted);
  }
  main hr { border: none; border-top: 1px solid var(--panel2); margin: 20px 0; }
  main a { color: var(--yellow); }
  main .error { color: var(--muted); }

  .site-footer {
    text-align: right;
    padding: 24px 40px 40px;
    border-top: 1px solid var(--panel2);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
  }
  .site-footer-nav { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; }
  .site-footer-nav a { color: var(--text); text-decoration: none; letter-spacing: 0.04em; }
  .site-footer-nav a:hover { color: var(--yellow); }
  .footer-dot { color: var(--muted); }
  .site-footer-copy { font-size: 0.68rem; opacity: 0.7; }

  @media (max-width: 760px) {
    .layout { display: block; }
    #nav { width: auto; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--panel2); }
    #nav a.section { display: none; }
    main { padding: 20px 16px 60px; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="/">avaliador<span class="dot">.</span>capas</a></h1>
  <span class="sub">documentation</span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="content"><p class="error">A carregar…</p></main>
</div>

<footer class="site-footer">
  <nav class="site-footer-nav">
    <a href="/">Dashboard</a>
    <span class="footer-dot">·</span>
    <a href="/search.html">Pesquisa</a>
    <span class="footer-dot">·</span>
    <a href="/similarities.html">Parecidas</a>
    <span class="footer-dot">·</span>
    <a href="https://github.com/DigasNikas" target="_blank" rel="noopener">GitHub</a>
    <span class="footer-dot">·</span>
    <span class="site-footer-copy">© 2026 Diogo Nicolau</span>
  </nav>
</footer>

<script src="/documentation.js?v=1"></script>
</body>
</html>
