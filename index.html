<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avaliador de Capas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <h1>Avaliador de Capas</h1>
      <div class="header-actions">
        <button id="btn-view-catalogue" class="btn-secondary">
          Catalogue <span id="catalogue-count" class="badge">0</span>
        </button>
      </div>
    </header>

    <!-- Date header -->
    <div id="date-header" class="hidden">
      <span id="date-label"></span>
      <span id="date-progress"></span>
    </div>

    <!-- Card Stack -->
    <main id="card-area">
      <div id="card-stack"></div>
      <div id="active-card-area" class="hidden"></div>

      <!-- All done -->
      <div id="empty-state" class="hidden">
        <div class="empty-icon">✓</div>
        <p>All images catalogued!</p>
        <button id="btn-reset" class="btn-primary">Start Over</button>
      </div>

      <!-- Loading -->
      <div id="loading-state" class="hidden">
        <div class="empty-icon">⏳</div>
        <p>Loading images…</p>
      </div>
    </main>

    <!-- Full-app swipe feedback background -->
    <div id="swipe-bg"></div>

    <!-- Catalogue Modal -->
    <div id="catalogue-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Catalogue</h2>
          <button id="btn-close-modal" class="btn-icon">✕</button>
        </div>
        <div class="modal-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="keep">Sporting</button>
          <button class="filter-btn" data-filter="favorite">Outros</button>
          <button class="filter-btn" data-filter="reject">Benfica</button>
          <button class="filter-btn" data-filter="skip">Porto</button>
        </div>
        <div id="catalogue-grid"></div>
        <p id="catalogue-empty" class="catalogue-empty hidden">No items in this category yet.</p>
      </div>
    </div>
    <div id="modal-overlay" class="hidden"></div>

    <!-- Progress bar -->
    <div id="progress-bar-container" class="hidden">
      <div id="progress-bar"></div>
      <span id="progress-text"></span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
