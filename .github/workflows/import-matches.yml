name: Import Match Dates

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season start year (e.g. 2024 for 2024-25)"
        required: false
        default: "2024"
      list_leagues:
        description: "List api-sports.io Portuguese league IDs instead of importing"
        type: boolean
        required: false
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Run import_matches.py
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.list_leagues }}" = "true" ]; then
            python3 scripts/import_matches.py --list-leagues
          else
            python3 scripts/import_matches.py "${{ inputs.season }}"
          fi
