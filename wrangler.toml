name            = "capas-scraper"
main            = "api/index.js"
compatibility_date = "2024-01-01"

# The zone routes below sit behind Bot Fight Mode, which challenges GitHub's
# runners and cannot be given a per-path exception on this plan — the scrape
# workflow has been answering 403 since August. workers.dev is not part of the
# zone, so CI calls the Worker there instead. Every route is still guarded by
# the same checks it has on the zone: app routes verify the Access JWT (see
# api/lib/access.js), admin routes need ADMIN_SECRET, the rest are public.
# Version preview URLs stay off: one extra hostname is enough.
workers_dev  = true
preview_urls = false

[triggers]
# 05:00-08:00 UTC hourly: the covers themselves, as soon as they are up.
# 10:00 and 13:00: headlines only. capasjornais.pt's titles page carries no
# date parameter and is still showing yesterday's edition during the scrape
# window, which is how every cover in the archive ended up filed with the
# previous day's text (see api/lib/scraper.js).
crons = ["0 5-8 * * *", "0 10,13 * * *"]

[[routes]]
pattern   = "capas.digasnikas.com/api/*"
zone_name = "digasnikas.com"

[[routes]]
pattern   = "app.capas.digasnikas.com/api/*"
zone_name = "digasnikas.com"

# LR_GATE_THRESHOLD is deliberately not a var. It is set as a secret
# (`wrangler secret put LR_GATE_THRESHOLD`) so it can change without a deploy,
# and so a deploy never silently resets it. Unset means the `others` gate is
# off and the model's own answer is stored — see api/lib/gate.js.
#
# Access app on app.capas.digasnikas.com. api/lib/access.js checks its JWTs
# against these. The AUD tag is in Zero Trust > Access > Applications.
[vars]
ACCESS_TEAM_DOMAIN = "digasnikas-digital.cloudflareaccess.com"
ACCESS_AUD         = "fcf7c786d5c3e993e0f0c5a72c0e04d01226390233c71f32059efb697e23f407"

[[r2_buckets]]
binding     = "COVERS_BUCKET"
bucket_name = "capas-storage"

[[d1_databases]]
binding       = "DB"
database_name = "capas-db"
database_id   = "a21b563d-6d8d-4355-af98-92045becf861"
migrations_dir = "migrations"

[images]
binding = "IMAGES"

[ai]
binding = "AI"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
