<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A minha conta · Avaliador de capas desportivas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=4" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <style>
    #account-app { max-width: 600px; margin: 0 auto; padding: 20px 16px 60px; display: flex; flex-direction: column; gap: 20px; }
    .acc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .acc-stat { background: var(--surface); border: 1px solid var(--border); padding: 14px; text-align: center; }
    .acc-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 900; color: var(--accent); }
    .acc-stat-label { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
    .acc-breakdown { display: flex; flex-direction: column; gap: 8px; }
    .acc-bar-row { display: grid; grid-template-columns: 70px 1fr 40px; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .acc-bar-track { height: 8px; background: var(--surface2); overflow: hidden; }
    .acc-bar-fill { height: 100%; }
    .acc-section-title { font-family: 'Inter Tight', system-ui, sans-serif; font-size: 1.05rem; font-weight: 900; font-style: italic; text-transform: uppercase; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div id="account-app">
    <header>
      <h1>A minha conta</h1>
      <div class="header-actions">
        <a href="https://capas.digasnikas.com/" class="btn-secondary">Início</a>
        <a href="/" class="btn-secondary">Votar</a>
        <a href="/cdn-cgi/access/logout" class="btn-secondary">Sair</a>
      </div>
    </header>

    <div class="acc-stats">
      <div class="acc-stat"><div id="acc-total" class="acc-stat-value">–</div><div class="acc-stat-label">Votos</div></div>
      <div class="acc-stat"><div id="acc-rank" class="acc-stat-value">–</div><div class="acc-stat-label">Posição</div></div>
      <div class="acc-stat"><div id="acc-pending" class="acc-stat-value">–</div><div class="acc-stat-label">Por votar</div></div>
    </div>

    <div class="modal-content">
      <div class="acc-section-title">Os teus votos</div>
      <div id="acc-breakdown" class="acc-breakdown"></div>
    </div>

    <div class="modal-content">
      <div class="modal-header">
        <h2>Histórico</h2>
      </div>
      <div class="modal-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="keep">Sporting</button>
        <button class="filter-btn" data-filter="favorite">Restantes</button>
        <button class="filter-btn" data-filter="reject">Benfica</button>
        <button class="filter-btn" data-filter="skip">Porto</button>
      </div>
      <div id="catalogue-nav" class="hidden">
        <button id="btn-catalogue-back" class="btn-back">‹ Voltar</button>
        <span id="catalogue-nav-label"></span>
      </div>
      <div id="catalogue-grid"></div>
      <p id="catalogue-empty" class="catalogue-empty hidden">Ainda não há votos aqui.</p>
    </div>
  </div>

  <script type="module" src="account.js?v=1"></script>
</body>
</html>
