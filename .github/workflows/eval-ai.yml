name: Evaluate AI Prompt

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Sample size (ignored if 'all' is checked)"
        required: false
        default: "40"
      all:
        description: "Score every labelled cover (~579 calls, most of a day's neuron budget)"
        type: boolean
        required: false
        default: false
      sample_json:
        description: "Optional: a pre-built [{club,url},...] JSON array, for when Bot Fight Mode is blocking /api/stats from this runner (see eval-ai.mjs's SAMPLE_FILE)"
        required: false
        default: ""

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write sample_json, if given
        if: inputs.sample_json != ''
        env:
          SAMPLE_JSON: ${{ inputs.sample_json }}
        run: echo "$SAMPLE_JSON" > /tmp/eval-sample.json
      - name: Run eval-ai.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SAMPLE_FILE: ${{ inputs.sample_json != '' && '/tmp/eval-sample.json' || '' }}
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then
            node scripts/eval-ai.mjs --all
          else
            node scripts/eval-ai.mjs --n "${{ inputs.n }}"
          fi
