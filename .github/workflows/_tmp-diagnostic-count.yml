name: _tmp diagnostic count

# Temporary, one-off: answers "how many covers are missing their first
# vote" for the vectorize-one-cover.yml redundant-dispatch investigation.
# Deleted right after use, not meant to stick around.

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g wrangler
      - name: Count covers vs voted covers
        run: |
          wrangler d1 execute capas-db --remote --command "
            SELECT
              (SELECT COUNT(*) FROM covers) AS total_covers,
              (SELECT COUNT(*) FROM analytics_covers) AS voted_covers,
              (SELECT COUNT(*) FROM covers) - (SELECT COUNT(*) FROM analytics_covers) AS missing_first_vote
          "
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
