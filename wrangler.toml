name            = "newspaper-scraper"
main            = "workers/index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 7 * * *"]   # 07:00 UTC daily (08:00 Lisbon time)

[[r2_buckets]]
binding     = "COVERS_BUCKET"
bucket_name = "newspaper-covers"   # change to your actual bucket name

[[d1_databases]]
binding       = "DB"
database_name = "newspaper-db"
database_id   = ""   # fill in after: wrangler d1 create newspaper-db
