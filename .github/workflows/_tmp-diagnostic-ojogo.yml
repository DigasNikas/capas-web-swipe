name: _tmp diagnostic ojogo classification

# Temporary, one-off: what clubs the RAG few-shot covers for the misclassified
# 2026-08-30 O Jogo cover were labelled. Deleted right after use.

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g wrangler
      - name: Inspect the RAG few-shot covers used
        run: |
          wrangler d1 execute capas-db --remote --command "
            SELECT c.id, c.newspaper, c.date, a.club
            FROM covers c
            JOIN analytics_covers a ON a.cover_id = c.id
            WHERE c.id IN (520, 1693, 616, 1646, 474)
          "
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
