name: Classify Covers

# Triggered automatically by repository_dispatch (event type
# scrape-completed), fired from the Worker's scheduled() handler right
# after each day's scrape finishes — see api/lib/github.js and
# api/index.js. Scraping no longer classifies anything itself, so this is
# the only place a freshly-scraped cover gets its ai_club: /rag-candidates
# returns covers still missing it, newest first, and a normal day only adds
# 3 (one per newspaper) against the default limit of 10, so this stays
# small and bounded rather than the unbounded backfill that once starved
# the Workers AI neuron quota for a week (the zero-shot-only backfill-ai
# endpoint that caused that has since been removed). Also runnable by hand
# via workflow_dispatch, for a larger backlog.

on:
  repository_dispatch:
    types: [scrape-completed]
  workflow_dispatch:
    inputs:
      matches_only:
        description: "Retrieval only: store the neighbours, skip the model (no Workers AI quota)"
        type: boolean
        required: false
        default: false
      date:
        description: "Classify one cover day (YYYY-MM-DD) instead of the newest backlog"
        required: false
      limit:
        description: "How many recent covers to reclassify (each is a Llama4 call; the free allowance is worth 30-40 a day)"
        required: false
        default: "3"

jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install Python dependencies
        # torch from PyTorch's CPU index, not PyPI: the default Linux wheel is
        # the CUDA build, which drags in cuDNN and thirty nvidia_* packages —
        # 1.5 GB of GPU runtime that a GitHub runner has no GPU to use. It made
        # this step take nine minutes for twenty-five seconds of work. The CPU
        # wheel is 192 MB and needs none of them.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -c scripts/requirements.txt numpy pillow transformers
      - name: Reclassify recent covers with RAG few-shot context
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # workers.dev, not the zone: Bot Fight Mode challenges runners on
          # capas.digasnikas.com (see scrape.yml), and this script POSTs its
          # results back.
          CAPAS_API: https://capas-scraper.digasnikas-digital.workers.dev
          CAPAS_STATS: https://capas-scraper.digasnikas-digital.workers.dev/stats
        # inputs.limit is only set on workflow_dispatch — repository_dispatch
        # (the daily scrape-completed trigger) has no `inputs` context, so it
        # falls back to 3, the number of covers a day actually brings.
        #
        # It was 10, which is harmless when the archive is labelled and the
        # only candidates are today's covers. With a backlog it is not: the
        # scrape fires this once an hour from 05:00 to 08:00, so four runs of
        # ten took ~32 Llama4 calls and the free allowance is worth 30-40 a
        # day. The morning crons ate the budget before anyone chose how to
        # spend it. Backfilling is a deliberate act now: pass a limit.
        run: |
          if [ "${{ inputs.matches_only }}" = "true" ]; then
            python3 scripts/rag_classify.py --matches-only --limit "${{ inputs.limit || '3' }}"
          else
            python3 scripts/rag_classify.py --limit "${{ inputs.limit || '3' }}" ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          fi
